name: CI/CD Pipeline

on:
  push:
    branches: [ main, feat/modernize-site ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Type check
      run: npm run type-check || npx tsc --noEmit
      
    - name: Build application
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: .next/
        
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Start server
      run: npm start &
      
    - name: Wait for server
      run: sleep 10
      
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:3000
        uploadArtifacts: true
        temporaryPublicStorage: true
        configPath: './.lighthouserc.json'
        
    - name: Comment PR with Lighthouse results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read Lighthouse results
          const resultsPath = path.join(process.cwd(), '.lighthouseci');
          const results = fs.readdirSync(resultsPath)
            .filter(file => file.endsWith('.json'))
            .map(file => JSON.parse(fs.readFileSync(path.join(resultsPath, file), 'utf8')));
          
          if (results.length > 0) {
            const result = results[0];
            const scores = result.summary;
            
            const comment = `## 🚀 Lighthouse Audit Results
            
            ### Performance Scores
            - **Performance**: ${Math.round(scores.performance * 100)}/100
            - **Accessibility**: ${Math.round(scores.accessibility * 100)}/100
            - **Best Practices**: ${Math.round(scores['best-practices'] * 100)}/100
            - **SEO**: ${Math.round(scores.seo * 100)}/100
            
            ### Recommendations
            ${scores.performance < 0.9 ? '⚠️ Performance could be improved' : '✅ Performance is good'}
            ${scores.accessibility < 0.9 ? '⚠️ Accessibility could be improved' : '✅ Accessibility is good'}
            ${scores['best-practices'] < 0.9 ? '⚠️ Best practices could be improved' : '✅ Best practices are good'}
            ${scores.seo < 0.9 ? '⚠️ SEO could be improved' : '✅ SEO is good'}
            
            [View detailed report](${process.env.LHCI_BUILD_URL || '#'})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
          
  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Deploy to Vercel (Preview)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'